name: Test client-to-master comment flow
on:
  workflow_dispatch:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - tests/backend/test-client-master-comment-flow.mjs
permissions:
  contents: read
jobs:
  test:
    name: Client comment and master reply integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify separate client and master accounts and comment flow
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          BLOG_TEST_CLIENT_LOGIN: ${{ secrets.E2E_CLIENT_1_LOGIN }}
          BLOG_TEST_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_1_PASSWORD }}
          BLOG_TEST_MASTER_LOGIN: ${{ secrets.E2E_MASTER_1_LOGIN }}
          BLOG_TEST_MASTER_PASSWORD: ${{ secrets.E2E_MASTER_1_PASSWORD }}
        run: node tests/backend/test-client-master-comment-flow.mjs
