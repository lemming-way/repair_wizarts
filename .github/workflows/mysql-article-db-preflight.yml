name: Direct MySQL article DB preflight

on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - 'tests/backend/mysql-article-db-preflight.mjs'
      - '.github/workflows/mysql-article-db-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MySQL client library
        run: npm install --no-save --no-package-lock mysql2
      - name: Read-only MySQL connectivity and schema preflight
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_SSL: ${{ secrets.MYSQL_SSL }}
        run: node tests/backend/mysql-article-db-preflight.mjs
