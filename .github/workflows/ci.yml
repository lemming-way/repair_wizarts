name: Article v1.3 CI

on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
      - 'work/**'
  pull_request:
    branches:
      - docs/repair-wizards-article-format-v1.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-v1.3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  article-v1-3:
    name: Article v1.3 regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PHP syntax check (article APIs)
        run: |
          php -l script_templates/repair_api.php
          php -l script_templates/repair_api_test.php
          php -l script_templates/repair_api_test_page.php
          php -l script_templates/repair_api_comments_public.php

      - name: ESLint (article renderer, catalog, API and helpers)
        run: >-
          npx eslint
          src/app/components/Article/renderer/ArticleRenderer.test.jsx
          src/app/components/Article/Articles.test.jsx
          src/app/components/Article/ArticleComment.jsx
          src/app/components/Article/ArticleComment.test.jsx
          src/app/state/api/blog.test.ts
          src/app/state/api/localComments.ts
          src/app/state/api/localComments.test.ts
          src/app/shared/lib/articleContent.ts
          src/app/shared/lib/articleContent.test.ts

      - name: ZIP importer and v1.3 validation tests
        run: npm run test:articles:importer

      - name: Build static article catalog from all docs ZIP packages
        run: npm run articles:build

      - name: Article renderer, catalog, API and media helper tests
        run: >-
          npm test --
          --watchAll=false
          --runInBand
          --runTestsByPath
          src/app/components/Article/renderer/ArticleRenderer.test.jsx
          src/app/components/Article/Articles.test.jsx
          src/app/components/Article/ArticleComment.test.jsx
          src/app/state/api/blog.test.ts
          src/app/state/api/localComments.test.ts
          src/app/shared/lib/articleContent.test.ts
