name: Backend read-only smoke test

on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm that this run only reads script_templates and makes no changes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only tutor API check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'push' || inputs.confirm_read_only == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run read-only backend check
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: ${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: ${{ secrets.REPAIR_API_U_HASH }}
        run: node tests/backend/read-only-smoke.mjs
