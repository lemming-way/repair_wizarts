name: Backend read-only smoke test

on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm that this run only reads script_templates and makes no changes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only tutor API check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'push' || inputs.confirm_read_only == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run read-only backend check
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: ${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: ${{ secrets.REPAIR_API_U_HASH }}
        run: node tests/backend/read-only-smoke.mjs

  inspect-blog-db:
    name: Read-only article DB inspection
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MySQL driver
        run: npm install --no-save --package-lock=false --ignore-scripts mysql2@3.14.1
      - name: Inspect article schema and existing rows (read only)
        env:
          REPAIR_DB_HOST: ${{ secrets.REPAIR_DB_HOST }}
          REPAIR_DB_PORT: ${{ secrets.REPAIR_DB_PORT }}
          REPAIR_DB_NAME: ${{ secrets.REPAIR_DB_NAME }}
          REPAIR_DB_USER: ${{ secrets.REPAIR_DB_USER }}
          REPAIR_DB_PASSWORD: ${{ secrets.REPAIR_DB_PASSWORD }}
          REPAIR_DB_ENVIRONMENT: ${{ vars.REPAIR_DB_ENVIRONMENT }}
        run: node tests/backend/inspect-blog-db.mjs
