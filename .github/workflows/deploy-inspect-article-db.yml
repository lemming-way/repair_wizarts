name: Deploy and inspect article DB test template
on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - 'script_templates/repair_api_test_page.php'
      - 'tests/backend/deploy-inspect-article-db.mjs'
      - '.github/workflows/deploy-inspect-article-db.yml'
permissions:
  contents: read
jobs:
  deploy-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy test template and inspect article DB
        env:
          REPAIR_API_BASE: \${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: \${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: \${{ secrets.REPAIR_API_U_HASH }}
        run: node tests/backend/deploy-inspect-article-db.mjs
