name: Inspect article database (read only)
on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - 'tests/backend/inspect-blog-db.mjs'
      - '.github/workflows/inspect-blog-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MySQL driver
        run: npm install --no-save --package-lock=false --ignore-scripts mysql2@3.14.1
      - name: Inspect blog schema and existing records (read only)
        env:
          REPAIR_DB_HOST: \${{ secrets.REPAIR_DB_HOST }}
          REPAIR_DB_PORT: \${{ secrets.REPAIR_DB_PORT }}
          REPAIR_DB_NAME: \${{ secrets.REPAIR_DB_NAME }}
          REPAIR_DB_USER: \${{ secrets.REPAIR_DB_USER }}
          REPAIR_DB_PASSWORD: \${{ secrets.REPAIR_DB_PASSWORD }}
          REPAIR_DB_ENVIRONMENT: \${{ vars.REPAIR_DB_ENVIRONMENT }}
        run: node tests/backend/inspect-blog-db.mjs
