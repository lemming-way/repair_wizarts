name: Create repair_api_test_page server template

on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - '.github/workflows/create-repair-api-test-page.yml'
      - 'tests/backend/create-template.mjs'
      - 'script_templates/repair_api_test_page.php'

permissions:
  contents: read

jobs:
  create-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create template if absent
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: ${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: ${{ secrets.REPAIR_API_U_HASH }}
        run: node tests/backend/create-template.mjs
