name: Import six v1.3 articles directly into MySQL

on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - 'tests/backend/import-articles-to-mysql.mjs'
      - '.github/workflows/import-articles-to-mysql.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/repair-wizards-article-format-v1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static article media for the six ZIP fixtures
        run: npm run articles:build
      - name: Publish generated article media to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/articles
          if ! git diff --cached --quiet; then
            git commit -m "Build static media for six v1.3 article fixtures"
            git push origin HEAD:docs/repair-wizards-article-format-v1.3
          else
            echo "Article media already up to date."
          fi
      - name: Install MySQL client library
        run: npm install --no-save --no-package-lock mysql2
      - name: Insert missing articles directly into MySQL
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_SSL: ${{ secrets.MYSQL_SSL }}
        run: node tests/backend/import-articles-to-mysql.mjs
