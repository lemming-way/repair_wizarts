name: Test repair_api_test_page (article comments DB integration)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Authenticated article comments integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute DB-backed article/comment CRUD and validation tests
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: ${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: ${{ secrets.REPAIR_API_U_HASH }}
        run: node tests/backend/test-repair-api-test-page.mjs
