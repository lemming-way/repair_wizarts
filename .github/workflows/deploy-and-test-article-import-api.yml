name: Staging PHP article importer end-to-end
on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - 'tests/backend/deploy-and-test-article-import-api.mjs'
      - '.github/workflows/deploy-and-test-article-import-api.yml'
      - 'script_templates/repair_api.php'
      - 'script_templates/blog_import_actions.php'
permissions:
  contents: read
jobs:
  staging-import-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/repair-wizards-article-format-v1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ZIP writer
        run: npm install --no-save --no-package-lock jszip
      - name: Deploy combined PHP importer and exercise validation, preview, import and media
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: ${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: ${{ secrets.REPAIR_API_U_HASH }}
        run: node tests/backend/deploy-and-test-article-import-api.mjs
      - name: Preserve pre-deployment backend template backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-api-before-import-e2e
          path: artifacts/repair_api.before-import-e2e.php
          if-no-files-found: ignore
          retention-days: 30
