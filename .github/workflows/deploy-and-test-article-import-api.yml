name: Test PHP article importer on repair_api_test_page
on:
  push:
    branches:
      - docs/repair-wizards-article-format-v1.3
    paths:
      - 'tests/backend/deploy-and-test-article-import-api.mjs'
      - '.github/workflows/deploy-and-test-article-import-api.yml'
      - 'script_templates/repair_api_test_page.php'
      - 'script_templates/blog_import_actions.php'
permissions:
  contents: read
jobs:
  staging-import-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/article-import-admin-panel
      - uses: actions/checkout@v4
        with:
          ref: docs/repair-wizards-article-format-v1.3
          path: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy test template and exercise ZIP validation and preview
        env:
          REPAIR_API_BASE: ${{ secrets.REPAIR_API_BASE }}
          REPAIR_API_TOKEN: ${{ secrets.REPAIR_API_TOKEN }}
          REPAIR_API_U_HASH: ${{ secrets.REPAIR_API_U_HASH }}
        run: node e2e/tests/backend/deploy-and-test-article-import-api.mjs
      - name: Preserve pre-deployment backend template backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-api-test-page-before-import-e2e
          path: artifacts/repair_api_test_page.before-import-e2e.php
          if-no-files-found: ignore
          retention-days: 30
